<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>札记 Glean</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="mark">札</span>
      <div>
        <strong>札记 / Glean</strong>
        <p>轻轻划下，慢慢拾起。</p>
      </div>
    </header>
    <button id="access" class="access-action" hidden>开启网页读取权限 <span>↗</span></button>
    <button id="page">本篇记录 <span>→</span></button>
    <button id="pause" class="pause-action">暂停本页札记 <span>Ⅱ</span></button>
    <button id="note">记一点灵感 <span>✎</span></button>
    <button id="library">打开收获库 <span>↗</span></button>
    <button id="settings">设置 <span>⚙</span></button>
    <p id="status" role="status">记录保存在此浏览器</p>
    <script src="popup.js"></script>
  </body>
</html>
